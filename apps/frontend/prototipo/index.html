<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auditorías por Instalación</title>
<meta name="theme-color" content="#0f5c6e">
<style>
:root{
  --bg:#f4f6f7; --surface:#ffffff; --surface-2:#eef2f3; --border:#d9e0e3;
  --text:#14212b; --muted:#5b6b75; --primary:#0f5c6e; --primary-ink:#ffffff; --primary-soft:#e2f0f3;
  --ok:#1e9e5a; --ok-soft:#e3f5ea; --warn:#c98a00; --warn-soft:#fdf3d8; --bad:#d64545; --bad-soft:#fbe6e6;
  --na:#8a98a1; --na-soft:#eceff1; --info:#2f6fd6; --info-soft:#e6eefb;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1519; --surface:#172026; --surface-2:#1e2a31; --border:#2b3a43;
    --text:#e6edf1; --muted:#9aabb5; --primary:#3fb0c9; --primary-ink:#06222a; --primary-soft:#163640;
    --ok:#3ccb7f; --ok-soft:#143523; --warn:#e8b23a; --warn-soft:#3a2f12; --bad:#f06b6b; --bad-soft:#3d1c1c;
    --na:#7d8b94; --na-soft:#222d33; --info:#6fa0f0; --info-soft:#1a2a45;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172026; --surface-2:#1e2a31; --border:#2b3a43;
  --text:#e6edf1; --muted:#9aabb5; --primary:#3fb0c9; --primary-ink:#06222a; --primary-soft:#163640;
  --ok:#3ccb7f; --ok-soft:#143523; --warn:#e8b23a; --warn-soft:#3a2f12; --bad:#f06b6b; --bad-soft:#3d1c1c;
  --na:#7d8b94; --na-soft:#222d33; --info:#6fa0f0; --info-soft:#1a2a45;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.app{min-height:100vh;padding-bottom:24px}
body.has-nav .app{padding-bottom:84px}
body:not(.has-nav) .nav{display:none}
body:not(.has-nav) .sticky-foot{bottom:12px}
/* Header */
.topbar{position:sticky;top:0;z-index:20;background:var(--primary);color:var(--primary-ink);padding:10px 16px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:16px;margin:0;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar small{display:block;font-weight:400;opacity:.85;font-size:12px}
.net{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap}
.theme-btn{width:34px;height:34px;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:inherit;display:grid;place-items:center;padding:0}
.theme-btn:hover{background:rgba(255,255,255,.3)}
.theme-btn svg{width:18px;height:18px}
.net.off{background:var(--warn);color:#1b1400}
.main{max-width:760px;margin:0 auto;padding:16px}
/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11.5px;padding:6px 2px;border-radius:10px}
.nav a.on{color:var(--primary);font-weight:650}
.nav svg{width:22px;height:22px}
@media (min-width:1000px){
  .app{padding-bottom:0}
  body.has-nav .app{padding-bottom:0;padding-left:220px}
  .nav{top:56px;bottom:0;right:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--border);padding:12px}
  .nav a{flex:0;flex-direction:row;gap:10px;font-size:14px;padding:10px 12px;justify-content:flex-start}
  .nav a.on{background:var(--primary-soft)}
  .topbar{padding-left:20px}
}
/* Primitives */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
h2{font-size:20px;margin:4px 0 2px}
h3{font-size:16px;margin:0}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 2px 8px;font-weight:650}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
a.btn{text-decoration:none;color:var(--text)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--primary);padding:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
input[type=text],input[type=search],input[type=date],textarea,select{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{min-height:80px;resize:vertical}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--na-soft);border:2px solid var(--na)}
.dot.cumple{background:var(--ok);border-color:var(--ok)}
.dot.no_cumple{background:var(--bad);border-color:var(--bad)}
.dot.na{background:var(--na);border-color:var(--na)}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.alert{border-radius:12px;padding:11px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 25%,transparent)}
.alert.bad{background:var(--bad-soft)}
.alert b{display:block;margin-bottom:2px}
/* Home */
.hero{background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 70%,#000));color:#fff;border-radius:18px;padding:18px}
.hero h2{margin:0 0 4px;font-size:21px}
.hero p{margin:0;opacity:.9;font-size:14px}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:14px;text-decoration:none;color:var(--text);display:block;box-shadow:var(--shadow)}
.tile .n{width:28px;height:28px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;margin-bottom:8px}
.tile b{display:block}
/* Steps */
.steps{display:flex;gap:6px;margin:4px 0 14px;overflow-x:auto;padding-bottom:2px}
.step{flex:1;min-width:76px;text-align:center;font-size:12px;color:var(--muted)}
.step i{display:block;height:4px;border-radius:9px;background:var(--border);margin-bottom:6px}
.step.on{color:var(--primary);font-weight:650}
.step.on i,.step.done i{background:var(--primary)}
.select-card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:12px}
.select-card.on{border-color:var(--primary);background:var(--primary-soft)}
.ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);flex:none;color:var(--primary)}
.ico svg{width:22px;height:22px}
.doc{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)}
.doc:first-child{border-top:0;padding-top:0}
.drop{border:2px dashed var(--border);border-radius:var(--radius);padding:18px;text-align:center;color:var(--muted);display:block;cursor:pointer;background:var(--surface)}
.drop:hover{border-color:var(--primary);color:var(--primary)}
.log{font:12.5px/1.6 ui-monospace,Consolas,monospace;background:var(--surface-2);border-radius:12px;padding:12px;min-height:120px}
.log div{opacity:0;animation:fade .3s forwards}
@keyframes fade{to{opacity:1}}
.req{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.req+.req{margin-top:8px}
.req.off{opacity:.5}
.req .t{font-weight:600}
.src{font-size:12px;color:var(--muted)}
.sticky-foot{position:sticky;bottom:84px;z-index:10;margin-top:14px}
@media (min-width:1000px){.sticky-foot{bottom:12px}}
/* Terreno */
.tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.group{margin-top:14px}
.group>summary{list-style:none;display:flex;align-items:center;gap:8px;font-weight:650;padding:8px 2px;cursor:pointer}
.group>summary::-webkit-details-marker{display:none}
.group>summary .cnt{margin-left:auto;font-weight:500}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text)}
.item+.item{margin-top:8px}
.item .t{font-weight:600;font-size:14.5px}
.chev{color:var(--muted);flex:none}
/* Fila de terreno con estado rápido (sin abrir el requisito) */
.item.q{flex-direction:column;align-items:stretch;gap:10px}
.q-top{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--text)}
.q-btns{display:grid;grid-template-columns:1fr 1fr .7fr;gap:6px}
.q-btns button{border:1.5px solid var(--border);background:var(--surface);border-radius:10px;min-height:38px;padding:4px 8px;font-size:12.5px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.q-btns button .dot{width:10px;height:10px}
.q-btns button.on.cumple{border-color:var(--ok);background:var(--ok-soft)}
.q-btns button.on.no_cumple{border-color:var(--bad);background:var(--bad-soft)}
.q-btns button.on.na{border-color:var(--na);background:var(--na-soft)}
.q-btns button:disabled{opacity:.55;cursor:default}
.item.done{text-decoration:none;border-width:2px}
.item.done .src{display:block;margin-top:2px}
.item.done .d-note{display:block;font-size:13px;margin-top:4px;color:var(--text)}
.item.done .st-lbl{font-size:12px;font-weight:700;white-space:nowrap}
.item.done.cumple{border-color:var(--ok);background:var(--ok-soft)}
.item.done.no_cumple{border-color:var(--bad);background:var(--bad-soft)}
.item.done.na{border-color:var(--na);background:var(--na-soft)}
.na-pick{background:var(--surface-2);border-radius:10px;padding:10px}
.na-pick .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.na-pick .chips button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px}
.na-pick .chips button.on{border-color:var(--na);background:var(--na-soft);font-weight:650}
.tema-na{margin-left:auto;border:1px solid var(--border);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;color:var(--muted)}
.group>summary .tema-na+.cnt{margin-left:0}
textarea.need{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)}
.toast{display:flex;align-items:center}
.toast .undo{margin-left:14px;border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:4px 0;white-space:nowrap}
.fab{position:fixed;right:16px;bottom:96px;z-index:25;width:58px;height:58px;border-radius:50%;border:0;background:var(--primary);color:var(--primary-ink);box-shadow:0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
@media (min-width:1000px){.fab{bottom:24px;right:24px}}
/* Detalle */
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border:2px solid var(--border);background:var(--surface);border-radius:14px;padding:14px 8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.st .dot{width:18px;height:18px}
.st.on.cumple{border-color:var(--ok);background:var(--ok-soft)}
.st.on.no_cumple{border-color:var(--bad);background:var(--bad-soft)}
.st.on.na{border-color:var(--na);background:var(--na-soft)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.ev{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:12px}
.ev img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--surface-2)}
.ev .ph{width:56px;height:56px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:700}
.hist{font-size:13px;border-left:2px solid var(--border);padding-left:12px}
.hist div{position:relative;padding:4px 0}
.hist div::before{content:"";position:absolute;left:-17px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
/* Panel */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.kpi .v{font-size:26px;font-weight:750;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted)}
.inst{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){.inst{grid-template-columns:repeat(3,1fr)}}
.ring{width:64px;height:64px;flex:none}
.bar-row{display:grid;grid-template-columns:minmax(110px,40%) 1fr 42px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* Chat */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;height:82vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px;height:640px}}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg .src{margin-top:6px}
.chat-in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
.sugs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px}
.sugs button{white-space:nowrap}
.crumb{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:2px}
.crumb:hover{color:var(--primary)}
a.select-card:hover{border-color:var(--primary)}
.locked{display:flex;align-items:center;gap:10px;margin-top:4px;padding:8px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--muted)}
.locked b{color:var(--text)}
.dialog{background:var(--surface);color:var(--text);border-radius:18px;padding:20px;width:calc(100% - 32px);max-width:400px;margin:auto;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.sheet-bg:has(.dialog){align-items:center}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <h1 id="hdr">Auditorías por instalación<small id="hdr-sub">Piscicultura Aucha</small></h1>
    <span class="net" id="net">En línea</span>
    <button class="theme-btn" id="theme-btn" data-action="theme" aria-label="Cambiar a modo oscuro" title="Cambiar tema"></button>
  </header>
  <nav class="nav" id="nav"></nav>
  <main class="main" id="view"></main>
</div>
<button class="fab hide" id="fab" aria-label="Abrir chat de normativa" data-action="chat-open">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>
<div id="overlay"></div>
<input type="file" id="file-doc" accept="application/pdf,.pdf,.doc,.docx" class="hide">
<input type="file" id="file-pert" accept="application/pdf,.pdf" class="hide">
<input type="file" id="file-photo" accept="image/*" capture="environment" class="hide">
<input type="file" id="file-any" accept="image/*,application/pdf,.pdf,.xlsx,.docx" class="hide">

<script>
/* =========================================================================
   DATOS DE EJEMPLO
   Extraídos manualmente de los documentos del reto (RCA 202410001185,
   Rectificación RCA, Res. Sanitaria SUSPEL y Res. Sanitaria RESPEL).
   El formato de REQ_TEMPLATES es el contrato que debería devolver el
   módulo de extracción con LLM.
   ========================================================================= */
const INSTALACIONES = [
  { id:'aucha', nombre:'Piscicultura Aucha', tipo:'Piscicultura', lugar:'Sector Aucha, Calbuco, Los Lagos', real:true },
  { id:'ces', nombre:'Centro de cultivo Ejemplo', tipo:'Centro de cultivo (CES)', lugar:'Datos ficticios', real:false, demo:{ pct:72, avance:100, nc:3, total:28 } },
  { id:'planta', nombre:'Planta de proceso Ejemplo', tipo:'Planta', lugar:'Datos ficticios', real:false, demo:{ pct:86, avance:64, nc:1, total:41 } },
];

const DOCS_AUCHA = [
  { id:'D1', tipo:'RCA', numero:'Res. Ex. N° 202410001185', fecha:'2024-09-13', emisor:'Comisión de Evaluación Región de Los Lagos', titulo:'Califica ambientalmente la DIA “Ampliación Piscicultura de Recirculación Aucha”', vigencia:'Vigente · modificada por rectificación', estado:'warn' },
  { id:'D2', tipo:'Rectificación', numero:'Documento N° 202410101706', fecha:'2024-12-19', emisor:'SEA Región de Los Lagos', titulo:'Rectifica 33 considerandos de la RCA 202410001185', vigencia:'Vigente', estado:'ok' },
  { id:'D3', tipo:'Res. sanitaria', numero:'Res. Ex. N° 2310322819', fecha:'2023-09-14', emisor:'SEREMI de Salud Los Lagos', titulo:'Autoriza almacenamiento de sustancias peligrosas (SUSPEL)', vigencia:'Vigente · prórroga automática desde 14-09-2026', estado:'ok' },
  { id:'D4', tipo:'Res. sanitaria', numero:'Res. Ex. N° 241020665', fecha:'2024-01-23', emisor:'SEREMI de Salud Los Lagos', titulo:'Autoriza sitio de almacenamiento de residuos peligrosos (RESPEL)', vigencia:'Vigente · requiere rectificar superficie', estado:'warn' },
];

function freshState(){ return { centro:null, cur:null, audits:[], seq:0, tab:'todos', q:'', pending:0, chat:[], editing:null, adding:false }; }
function newAudit({inst, nombre, tipo, fecha}){
  S.seq = (S.seq||0) + 1;
  const real = inst==='aucha';
  return { id:'A'+S.seq+'-'+Date.now().toString(36).slice(-4), inst, nombre, tipo, fecha, creada:nowISO(), step:2,
    docs: real ? DOCS_AUCHA.map(d=>({...d})) : [], perts: real ? PERT_AUCHA.map(p=>({...p})) : [], extras:[],
    status:'sin_preparar', generado:false, validador:'', publicada:null, cerrada:null, reqs:[], temasOff:[] };
}
let S, A = null;
function syncA(){ A = (S.audits||[]).find(a=>a.id===S.cur) || null; }
function load(){ try{ const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : freshState(); }catch(e){ S = freshState(); } if(!Array.isArray(S.audits)) S = freshState(); S.naPick=null; S.notePick=null; S.noteDraft=null;
  // "Parcial" se eliminó: los datos guardados antes pasan a "No cumple" (ya tienen nota).
  S.audits.forEach(a=>a.reqs.forEach(r=>{ if(r.estado==='parcial') r.estado='no_cumple'; }));
  syncA(); }
function save(markPending){ if(markPending){ S.pending++; scheduleSync(); } try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function docById(id, a=A){
  if(id==='MANUAL') return {numero:'', tipo:'Criterio del responsable'};

  return src.docs.find(d=>d.id===id) || src.extras.find(d=>d.id===id) || src.perts.find(d=>d.id===id) || {numero:id, tipo:''};

// Con undoFn el toast muestra "Deshacer" y dura más (por si el toque en terreno fue accidental).
let undoFn = null;
function toast(msg, undo){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  undoFn = undo || null;
  if(undo){ const b=document.createElement('button'); b.className='undo'; b.dataset.action='undo'; b.textContent='Deshacer'; t.appendChild(b); }
  document.body.appendChild(t); setTimeout(()=>{ t.remove(); if(undoFn===undo) undoFn=null; }, undo?5000:2600);
}
function dueTag(iso){ if(!iso) return ''; const d=daysTo(iso); const cls = d<0?'bad':d<=14?'warn':'info'; const txt = d<0?`Vencido hace ${-d} d`:d===0?'Vence hoy':`Vence en ${d} d`; return `<span class="tag ${cls}">${txt}</span>`; }

function stats(list){
  const s={total:list.length,cumple:0,no_cumple:0,na:0,pendiente:0};
  list.forEach(r=>s[r.estado||'pendiente']++);
  const evaluados = s.cumple+s.no_cumple;
  s.llenos = s.total - s.pendiente;
  s.avance = s.total ? Math.round(s.llenos/s.total*100) : 0;
  s.pct = evaluados ? Math.round(s.cumple/evaluados*100) : null;
  return s;
}

/* ---------- Tema claro / oscuro (elegido por el usuario, por defecto claro) ---------- */
const THEME_KEY = 'auditorias-tema';
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  const b = $('#theme-btn');
  b.innerHTML = icon(t==='dark'?'sun':'moon', 18);
  b.setAttribute('aria-label', t==='dark'?'Cambiar a modo claro':'Cambiar a modo oscuro');
  document.querySelector('meta[name=theme-color]').content = t==='dark' ? '#172026' : '#0f5c6e';
}
function getTheme(){ try{ return localStorage.getItem(THEME_KEY)==='dark' ? 'dark' : 'light'; }catch(e){ return 'light'; } }
function toggleTheme(){ const t = getTheme()==='dark' ? 'light' : 'dark'; try{ localStorage.setItem(THEME_KEY, t); }catch(e){} applyTheme(t); }
const icon = (n, size=22) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

function route(){ return (location.hash.replace(/^#\/?/,'') || 'inicio').split('/'); }

function renderNav(){
  const [r] = route();
  // La barra solo aparece dentro de una auditoría: antes no se sabe a cuál se está entrando.
  const show = !!A && ['preparar','terreno','panel','req'].includes(r);
  document.body.classList.toggle('has-nav', show);
  if(!show){ $('#nav').innerHTML=''; return; }
  const items = [[`centro/${A.inst}`,'Auditorías','home'],['terreno','Terreno','field'],['panel','Panel','panel']];
  const on = id => r===id || (id==='terreno' && r==='req');
  $('#nav').innerHTML = items.map(([id,l,ic])=>`<a href="#/${id}" class="${on(id)?'on':''}">${icon(ic)}<span>${l}</span></a>`).join('');
}
const INST_ICON = {aucha:'fish', ces:'boat', planta:'factory'};

// Resumen de un centro: última auditoría con requisitos (o datos ficticios si no hay).
function instSummary(i){
  const list = auditsOf(i.id);
  const conReqs = list.find(a=>activeReqs(a).length);
  if(conReqs){ const s = stats(activeReqs(conReqs)); return {pct:s.pct, avance:s.avance, nc:s.no_cumple, total:s.total, audit:conReqs, n:list.length}; }
  if(i.demo) return {...i.demo, n:list.length, ficticio:true};
  return {pct:null, avance:0, nc:0, total:0, n:list.length};
}

/* ---------- 1. Selección de centro ---------- */
function viewInicio(){
  return `<div class="stack">
    <div class="hero">
      <h2>¿Qué centro vas a auditar?</h2>
      <p>Elige la instalación para ver sus auditorías o crear una nueva.</p>
    </div>
    ${INSTALACIONES.map(i=>{
      const s = instSummary(i), enCurso = auditsOf(i.id).filter(a=>a.status!=='cerrada').length;
      return `<a class="select-card" href="#/centro/${i.id}" style="text-decoration:none;color:inherit">
        ${ring(s.pct, pctColor(s.pct))}
        <span class="grow"><b>${esc(i.nombre)}</b><br><span class="small muted">${esc(i.tipo)} · ${esc(i.lugar)}</span>
        <br><span class="xs">${s.n ? `${s.n} auditoría${s.n>1?'s':''}${enCurso?` · ${enCurso} en curso`:''}` : 'Sin auditorías'}${s.ficticio?' · datos ficticios':''}</span></span>
        <span class="chev">${icon('chev',18)}</span></a>`;
    }).join('')}
    ${S.audits.length ? '' : `<div class="card row wrap"><div class="grow small"><b>¿Presentando?</b><br><span class="muted">Carga un ejemplo con dos auditorías de Aucha: una cerrada y otra en terreno.</span></div><button class="btn sm" data-action="demo">Cargar ejemplo</button></div>`}
    <div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost small" data-action="reset">Reiniciar prototipo</button></div>
  </div>`;
}

/* ---------- 2. Auditorías del centro ---------- */
function auditCard(a){
  const st = stats(activeReqs(a)), info = STATUS[a.status];
  const conAvance = a.status==='publicada' || a.status==='cerrada';
  return `<div class="card">
    <div class="row" style="align-items:flex-start"><div class="grow"><h3>${esc(a.nombre)}</h3>
      <div class="small muted">${esc(a.tipo)} · ${fmtDate(a.fecha)}${a.validador?` · validó ${esc(a.validador)}`:''}</div></div>
      <span class="tag ${info.cls}">${info.label}</span></div>
    ${conAvance ? `<div style="margin-top:10px">${progressBar(st)}</div>
      <div class="small muted" style="margin-top:6px">${st.llenos}/${st.total} llenados · ${st.pct==null?'sin evaluar':st.pct+'% cumplimiento'} · ${st.no_cumple} no cumple</div>`
      : `<div class="small muted" style="margin-top:8px">${a.status==='en_validacion'?`${a.reqs.filter(r=>r.val!=='descartado').length} requisitos por validar`:'Falta cargar documentos y generar requisitos'}</div>`}
    <div class="row" style="margin-top:12px;gap:8px">
      <a class="btn primary sm grow" href="#/a/${a.id}">${info.accion}</a>
      ${conAvance && a.status!=='cerrada' ? `<a class="btn sm" href="#/a/${a.id}/panel">Panel</a>` : ''}
    </div></div>`;
}
function viewCentro(id){
  const i = instById(id); if(!i) return viewInicio();
  const list = auditsOf(id), enCurso = list.filter(a=>a.status!=='cerrada'), cerradas = list.filter(a=>a.status==='cerrada');
  return `<div class="stack">
    <a href="#/inicio" class="crumb">${icon('back',16)} Centros</a>
    <div class="row"><span class="ico">${icon(INST_ICON[id])}</span><div class="grow"><h2 style="margin:0">${esc(i.nombre)}</h2><div class="small muted">${esc(i.tipo)} · ${esc(i.lugar)}</div></div></div>
    <a class="btn primary block" href="#/nueva" style="padding:14px;font-size:16px">+ Crear nueva auditoría</a>
    ${!list.length ? `<div class="empty card">Este centro aún no tiene auditorías.<br>Crea la primera con el botón de arriba.</div>` : ''}
    ${enCurso.length ? `<div class="sec-title">En curso · ${enCurso.length}</div>${enCurso.map(auditCard).join('')}` : ''}
    ${cerradas.length ? `<div class="sec-title">Finalizadas · ${cerradas.length}</div>${cerradas.map(auditCard).join('')}` : ''}
    ${i.real ? `<div class="sec-title">Documentos del centro</div>
      <div class="card small">${DOCS_AUCHA.map(d=>`<div class="row" style="padding:4px 0"><span class="tag">${esc(d.tipo)}</span><span class="grow">${esc(d.numero)}</span><span class="tag ${d.estado}">${d.estado==='ok'?'Vigente':'Revisar'}</span></div>`).join('')}</div>
      <div class="sec-title">Alertas detectadas en los documentos</div>${ALERTAS.map(alertHTML).join('')}` :
      `<div class="alert info"><div>Este centro usa datos de ejemplo: no tiene documentos del reto. Puedes crear auditorías y agregar requisitos manualmente.</div></div>`}
  </div>`;
}

/* ---------- 3. Crear nueva auditoría ---------- */

  const inst = instById(S.centro);
  if(!inst) return `<div class="empty card"><h3>Primero elige un centro</h3><p class="small">Las auditorías se crean dentro de un centro.</p><a class="btn primary" href="#/inicio">Elegir centro</a></div>`;
  const centro = inst.id, hoy = new Date().toISOString().slice(0,10);
  const mes = new Date().toLocaleDateString('es-CL',{month:'long', year:'numeric'});
  return `<div class="stack">
    <a href="#/centro/${centro}" class="crumb">${icon('back',16)} Volver</a>
    <h2>Crear nueva auditoría</h2>
    <div class="card stack">
      <div class="small"><b>Centro</b>
        <div class="locked" aria-readonly="true"><span class="ico" style="width:32px;height:32px">${icon(INST_ICON[centro],18)}</span>
          <span class="grow"><b>${esc(inst.nombre)}</b><br><span class="xs muted">${esc(inst.tipo)}</span></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Bloqueado"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <input type="hidden" id="nv-inst" value="${centro}"></div>
      <label class="small"><b>Tipo de auditoría</b><select id="nv-tipo">${TIPOS_AUDITORIA.map(t=>`<option>${t}</option>`).join('')}</select></label>
      <label class="small"><b>Nombre</b><input type="text" id="nv-nombre" value="Auditoría interna ${esc(mes)}"></label>
      <label class="small"><b>Fecha programada</b><input type="date" id="nv-fecha" value="${hoy}"></label>
    </div>
    <div class="small muted">Después cargarás los documentos, generarás los requisitos y un responsable los validará.</div>

function crumbHTML(){ return `<a href="#/centro/${A.inst}" class="crumb">${icon('back',16)} ${esc(instById(A.inst).nombre)} · auditorías</a>`; }
function noAuditHTML(){ return `<div class="empty card"><h3>No hay una auditoría abierta</h3><p class="small">Elige un centro y luego crea o abre una auditoría.</p><a class="btn primary" href="#/inicio">Elegir centro</a></div>`; }
function alertHTML(a){ return `<div class="alert ${a.tipo}" style="margin-bottom:8px"><div><b>${esc(a.titulo)}</b>${esc(a.texto)}</div></div>`; }

function progressBar(st){
  const w = k => st.total ? (st[k]/st.total*100) : 0;
  return `<div class="progress" role="img" aria-label="Avance">
    <i style="width:${w('cumple')}%;background:var(--ok)"></i><i style="width:${w('no_cumple')}%;background:var(--bad)"></i><i style="width:${w('na')}%;background:var(--na)"></i></div>`;
}

/* ---------- Preparar (wizard) ---------- */
function viewPreparar(){
  if(!A) return noAuditHTML();
  const steps = ['Datos','Documentos','Pertinencias','Requisitos'];
  const head = `${crumbHTML()}<h2>Preparar auditoría</h2><p class="muted small" style="margin:0 0 10px">${esc(A.nombre)} · antes de ir al lugar</p>
    <div class="steps">${steps.map((s,i)=>`<div class="step ${A.step===i+1?'on':A.step>i+1?'done':''}"><i></i>${i+1}. ${s}</div>`).join('')}</div>`;
  return head + [null,prepDatos,prepDocs,prepPerts,prepReqs][A.step]();
}

      ${A.perts.map(p=>`<div class="doc"><span class="ico">${icon('file')}</span><div class="grow">

function prepReqs(){
  if(!A.generado){
    return `<div class="stack"><div class="card">
      <h3>Generar listado de requisitos</h3>
      <p class="small muted" style="margin:4px 0 12px">Se leerán ${A.docs.length + A.extras.length} documentos y ${A.perts.filter(p=>p.cargada).length} pertinencias para identificar las obligaciones aplicables.</p>
      <div class="log" id="log"><span class="muted">Listo para procesar.</span></div>
    </div>
    <div class="sticky-foot row"><button class="btn" data-action="step" data-n="3">Atrás</button><button class="btn primary grow" data-action="generate" id="gen-btn">Generar requisitos</button></div></div>`;
  }
  const temas = [...new Set(A.reqs.map(r=>r.tema))];
  const sel = A.reqs.filter(r=>r.val!=='descartado' && !A.temasOff.includes(r.tema));
  const published = A.status==='publicada' || A.status==='cerrada';
  return `<div class="stack">
    ${!A.reqs.length?`<div class="alert warn"><div><b>No se detectaron requisitos</b>Los documentos de este centro no se pudieron procesar en el prototipo. Agrega los requisitos manualmente.</div></div>`:''}
    <div class="alert info"><div><b>Validación obligatoria</b>Los requisitos generados automáticamente deben ser revisados por un responsable antes de usarse en la auditoría.</div></div>
    <div class="card"><h3>Temáticas de la auditoría</h3><p class="small muted" style="margin:4px 0 10px">Elige qué temáticas forman parte de esta auditoría.</p>
      <div class="row wrap" style="gap:6px">${temas.map(t=>`<button class="chip ${A.temasOff.includes(t)?'':'on'}" data-action="toggle-tema" data-t="${esc(t)}">${esc(t)} · ${A.reqs.filter(r=>r.tema===t&&r.val!=='descartado').length}</button>`).join('')}</div></div>
    ${S.adding ? addFormHTML(temas) : `<button class="btn block" data-action="add-open">+ Agregar requisito que no detectó el análisis</button>`}
    ${temas.filter(t=>!A.temasOff.includes(t)).map(t=>`<div><div class="sec-title">${esc(t)}</div>
      ${A.reqs.filter(r=>r.tema===t).map(reqValHTML).join('')}</div>`).join('')}
    <div class="card sticky-foot stack ${S.adding?'hide':''}">
      ${published?`<div class="small"><b>Auditoría publicada</b> por ${esc(A.validador)} el ${fmtDate(A.publicada)}. Los cambios aquí se reflejan en terreno.</div>`:`
      <label class="small" for="validador"><b>Responsable que valida</b></label>
      <input type="text" id="validador" placeholder="Nombre y cargo" value="${esc(A.validador)}">`}

    </div>

}

    <div class="row" style="align-items:flex-start">

/* ---------- Terreno ---------- */
function viewTerreno(){
  if(!A) return noAuditHTML();
  const closed = A.status==='cerrada';
  if(A.status!=='publicada' && !closed){
    return `${crumbHTML()}<div class="empty card"><h3>Esta auditoría aún no está publicada</h3><p class="small">Primero prepárala: carga los documentos, genera los requisitos y valídalos.</p>
      <a class="btn primary" href="#/preparar">Preparar auditoría</a></div>`;
  }
  const st = stats(activeReqs());
  return `<div class="stack">
    ${crumbHTML()}
    <div><h2>Trabajo en terreno</h2><div class="small muted">${esc(instById(A.inst).nombre)} · ${esc(A.nombre)}</div></div>
    ${closed?`<div class="alert info"><div><b>Auditoría cerrada el ${fmtDate(A.cerrada)}</b>Solo lectura: puedes revisar los resultados y evidencias.</div></div>`:''}
    <div class="card">${progressBar(st)}<div class="row small" style="margin-top:8px"><span class="grow muted">${st.llenos}/${st.total} llenados</span><span><b>${st.pct==null?'—':st.pct+'%'}</b> cumplimiento</span></div>
      <div class="legend" style="margin-top:8px"><span><i style="background:var(--ok)"></i>Cumple ${st.cumple}</span><span><i style="background:var(--bad)"></i>No cumple ${st.no_cumple}</span><span><i style="background:var(--na)"></i>N/A ${st.na}</span></div></div>
    <input type="search" id="q" placeholder="Buscar requisito, tema o documento…" value="${esc(S.q)}" aria-label="Buscador">
    <div class="tabs"><button class="${S.tab==='todos'?'on':''}" data-action="tab" data-t="todos">Todos · ${st.total}</button><button class="${S.tab==='done'?'on':''}" data-action="tab" data-t="done">Llenados · ${st.llenos}</button><button class="${S.tab==='pend'?'on':''}" data-action="tab" data-t="pend">Pendientes · ${st.pendiente}</button></div>
    <div id="list">${listHTML()}</div>
    ${closed?'':`<button class="btn block" data-action="add-from-field">+ Agregar requisito encontrado en terreno</button>`}
  </div>`;
}
function listHTML(){
  const q = S.q.trim().toLowerCase();
  let list = activeReqs().filter(r => S.tab==='pend' ? r.estado==='pendiente' : S.tab==='done' ? r.estado!=='pendiente' : true);
  if(q) list = list.filter(r => (r.titulo+' '+r.tema+' '+r.detalle+' '+docById(r.fuente.doc).numero).toLowerCase().includes(q));
  if(!list.length) return `<div class="empty">${q?'Ningún requisito coincide con la búsqueda.':S.tab==='pend'?'No hay requisitos pendientes. ¡Buen trabajo!':S.tab==='done'?'Aún no hay requisitos llenados.':'No hay requisitos en esta auditoría.'}</div>`;
  const temas = [...new Set(list.map(r=>r.tema))];
  const ro = A.status==='cerrada';
  return temas.map(t=>{
    // Dentro de cada temática, los pendientes van primero para que se vean; los ya marcados bajan.
    const items = list.filter(r=>r.tema===t).sort((a,b)=>(a.estado==='pendiente'?0:1)-(b.estado==='pendiente'?0:1));
    const pend = items.filter(r=>r.estado==='pendiente').length;
    const temaNA = S.tab!=='done' && !ro && pend>1 ? `<button class="tema-na" data-action="tema-na" data-t="${esc(t)}">Tema no aplica</button>` : '';
    const cnt = S.tab==='todos' ? `${items.length-pend}/${items.length}` : items.length;
    return `<details class="group" open><summary>${esc(t)}${temaNA}<span class="cnt small muted">${cnt}</span></summary>
      ${items.map(r=>r.estado==='pendiente' ? itemHTML(r, ro) : doneHTML(r)).join('')}
    </details>`;
  }).join('');
}

/* ---------- Chat de normativa ---------- */
const STOP = new Set('el la los las de del y o a en que por para con un una se es al lo como cual cuando cuál cuándo qué que hay debo tengo sobre su sus me mi más'.split(' '));
function botAnswer(q){
  const tokens = q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/[^a-z0-9ñ]+/).filter(t=>t.length>2 && !STOP.has(t));
  const pool = A && A.reqs.length ? A.reqs : REQ_TEMPLATES.map(t=>({...t}));
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const scored = pool.map(r=>{ const hay = norm(r.titulo+' '+r.tema+' '+r.detalle+' '+r.frecuencia); return {r, s:tokens.reduce((n,t)=>n+(hay.includes(t)?(norm(r.titulo).includes(t)?2:1):0),0)}; }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,2);
  if(!scored.length) return {text:'No encontré un requisito relacionado en los documentos cargados. Prueba con palabras como “ruido”, “lodos”, “RESPEL”, “playa” o “declaración”.'};
  const r = scored[0].r, d = docById(r.fuente.doc);
  let text = `${r.titulo}\n${r.detalle}\nFrecuencia: ${r.frecuencia}. Evidencia esperada: ${r.evidencia}.`;
  if(r.venc) text += `\nPróximo vencimiento: ${fmtDate(r.venc)}.`;
  if(scored[1]) text += `\n\nTambién relacionado: ${scored[1].r.titulo}.`;
  return {text, src:`Fuente: ${d.tipo} ${d.numero} · ${r.fuente.ref}`};
}

function applyEstado(r, k, {obs, naMotivo, hist, silent}={}){
  const snap = {estado:r.estado, obs:r.obs, naMotivo:r.naMotivo, h:r.hist.length};
  r.estado = k;
  r.naMotivo = k==='na' ? (naMotivo||r.naMotivo||'') : '';

  addHist(r, hist || (k==='na' ? `Marcado como “No aplica”: ${r.naMotivo}` : `Marcado como “${ESTADOS[k]}”${obs?' con nota':''}`));
  save(true); render();

  const msg = k==='pendiente' ? 'Volvió a Pendientes' : `${ESTADOS[k]} · ${r.titulo.length>28 ? r.titulo.slice(0,28)+'…' : r.titulo}`;
  toast(msg, ()=>{ Object.assign(r, {estado:snap.estado, obs:snap.obs, naMotivo:snap.naMotivo}); r.hist.length=snap.h; save(true); render(); toast('Cambio deshecho'); });

function publish(){

  const name = $('#validador').value.trim(); if(!name) return;

    if(A.temasOff.includes(r.tema)){ r.val='fuera'; return; }
    r.val='validado'; r.hist.push({f:nowISO(), a:'Validado para la auditoría', q:name});
  });
  A.status='publicada'; A.publicada=nowISO(); save(true);
  toast('Auditoría publicada. Ya está disponible en terreno.');
  location.hash='#/terreno';
}

    {f:publicada+'T15:30:00Z', a:'Validado para la auditoría', q:a.validador}]}));
  a.reqs.forEach(r=>{ if(set[r.id]){ r.estado=set[r.id]; r.obs=obs[r.id] || (r.estado==='no_cumple' ? 'Hallazgo registrado en terreno; ver evidencia.' : '');
      if(r.estado==='na') r.naMotivo = r.tema==='Construcción' ? NA_MOTIVOS[1] : NA_MOTIVOS[0]; r.evidencias=[{nombre:`evidencia_${r.id.toLowerCase()}.jpg`, fecha:publicada, sync:true}]; r.hist.push({f:publicada+'T18:00:00Z', a:`Marcado como “${ESTADOS[r.estado]}” con 1 evidencia`, q:quien}); }});
  a.status = cerrada ? 'cerrada' : 'publicada'; a.publicada = publicada; a.cerrada = cerrada || null;
  return a;
}

function resizeImage(file){
  return new Promise(res=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const k = Math.min(1, 480/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*k; c.height=img.height*k; c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.6)); };
    img.onerror = ()=>res(null); img.src = url;
  });
}
let evTarget = null;
async function onEvidence(file){
  const r = A.reqs.find(x=>x.id===evTarget); if(!r||!file) return;
  const thumb = file.type.startsWith('image/') ? await resizeImage(file) : null;
  r.evidencias.push({nombre:file.name||'foto.jpg', fecha:new Date().toISOString().slice(0,10), thumb, sync:false});
  addHist(r, `Evidencia agregada: ${file.name||'foto'}`);
  save(true); render();
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]'); if(!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  const req = id && A && A.reqs.find(r=>r.id===id);
  switch(a){
    case 'create-audit': {
      const nombre = $('#nv-nombre').value.trim(); if(!nombre){ toast('Ponle un nombre a la auditoría'); break; }
      const au = newAudit({inst:$('#nv-inst').value, nombre, tipo:$('#nv-tipo').value, fecha:$('#nv-fecha').value || new Date().toISOString().slice(0,10)});
      S.audits.push(au); save(); toast('Auditoría creada'); location.hash = '#/a/'+au.id+'/preparar'; break;
    }
    case 'close-audit': askConfirm({titulo:'¿Cerrar la auditoría?', texto:'Quedará en solo lectura dentro del historial del centro. Podrás revisar sus resultados y evidencias, pero no modificarlos.', ok:'Cerrar auditoría'},
      ()=>{ A.status='cerrada'; A.cerrada=new Date().toISOString().slice(0,10); save(true); toast('Auditoría cerrada'); render(); }); break;
    case 'confirm-yes': { const fn=confirmFn; confirmFn=null; $('#overlay').innerHTML=''; fn && fn(); break; }
    case 'confirm-no': confirmFn=null; $('#overlay').innerHTML=''; break;
    case 'confirm-no-bg': if(e.target===el){ confirmFn=null; $('#overlay').innerHTML=''; } break;
    case 'step': A.step=+el.dataset.n; save(); render(); window.scrollTo(0,0); break;
    case 'pert-load': { const p=A.perts.find(x=>x.id===id); p.cargada=true; save(); render(); toast('Pertinencia cargada'); break; }
    case 'generate': generate(); break;
    case 'toggle-tema': { const t=el.dataset.t; A.temasOff = A.temasOff.includes(t) ? A.temasOff.filter(x=>x!==t) : [...A.temasOff, t]; save(); render(); break; }
    case 'edit': S.editing=id; render(); break;
    case 'edit-cancel': S.editing=null; render(); break;
    case 'edit-save': req.titulo=$('#ed-t').value.trim()||req.titulo; req.detalle=$('#ed-d').value.trim()||req.detalle; req.editado=true; req.hist.push({f:nowISO(),a:'Editado por el responsable',q:A.validador||'Responsable'}); S.editing=null; save(); render(); break;
    case 'discard': req.val='descartado'; req.hist.push({f:nowISO(),a:'Descartado por el responsable',q:A.validador||'Responsable'}); save(); render(); break;
    case 'restore': req.val= A.status==='publicada'?'validado':'propuesto'; save(); render(); break;
    case 'add-open': S.adding=true; render(); setTimeout(()=>{ $('#add-form')?.scrollIntoView({behavior:'smooth',block:'start'}); $('#add-tema')?.focus(); },50); break;
    case 'add-from-field': A.step=4; S.adding=true; save(); location.hash='#/preparar'; setTimeout(()=>{ $('#add-form')?.scrollIntoView({block:'start'}); $('#add-tema')?.focus(); },80); break;
    case 'add-cancel': S.adding=false; render(); break;
    case 'add-save': {
      const tema=$('#add-tema').value.trim(), titulo=$('#add-titulo').value.trim();
      if(!tema||!titulo){ toast('Completa la temática y el requisito'); break; }
      const venc=$('#add-venc').value.trim(), pub=A.status==='publicada', quien=A.validador||'Responsable';
      const n = A.reqs.filter(r=>r.manual).length+1;
      const r = { id:'M'+String(n).padStart(2,'0')+'-'+Date.now().toString(36).slice(-3), manual:true, tema, titulo,
        detalle:$('#add-detalle').value.trim()||'Requisito agregado por el responsable.',
        fuente:{doc:$('#add-doc').value, ref:$('#add-ref').value.trim()||'—'}, frecuencia:$('#add-frec').value,
        evidencia:$('#add-ev').value.trim()||'Por definir', venc:/^\d{4}-\d{2}-\d{2}$/.test(venc)?venc:undefined,
        val:pub?'validado':'propuesto', estado:'pendiente', obs:'', evidencias:[],
        hist:[{f:nowISO(), a:'Agregado manualmente (no detectado por el análisis)', q:quien}] };
      if(pub) r.hist.push({f:nowISO(), a:'Validado para la auditoría', q:quien});
      A.temasOff = A.temasOff.filter(t=>t!==tema);
      A.reqs.push(r); S.adding=false; save(pub);
      if(pub){ toast('Requisito agregado a la auditoría en terreno'); location.hash='#/req/'+r.id; }
      else { render(); toast('Requisito agregado'); }
      break;
    }
    case 'publish': publish(); break;
    case 'tab': S.tab=el.dataset.t; S.naPick=null; S.notePick=null; S.noteDraft=null; save(); render(); break;
    case 'set-estado': {
      const k=el.dataset.k;
      if(req.estado!==k && k==='no_cumple' && !(($('#obs')?.value||req.obs||'').trim())){
        toast(`Para marcar ${ESTADOS[k]} escribe primero la observación`); const o=$('#obs'); o?.classList.add('need'); o?.focus(); break;
      }
      const o=$('#obs'); if(o && o.value!==req.obs) req.obs=o.value;
      if(k==='na' && req.estado!=='na'){ req.estado='na'; req.naMotivo=req.naMotivo||''; addHist(req,'Marcado como “No aplica”'); save(true); render(); toast('Elige el motivo de No aplica'); break; }
      req.estado = req.estado===k ? 'pendiente' : k; if(req.estado!=='na') req.naMotivo='';
      addHist(req, req.estado==='pendiente'?'Estado borrado':`Marcado como “${ESTADOS[k]}”`); save(true); render(); toast(req.estado==='pendiente'?'Estado borrado':`Guardado: ${ESTADOS[k]}`); break;
    }
    case 'quick-estado': {
      const k=el.dataset.k;
      if(req.estado===k){ applyEstado(req, 'pendiente', {hist:'Estado borrado'}); break; }
      if(k==='cumple'){ applyEstado(req, k); break; }
      if(k==='na'){ S.notePick=null; S.naPick = S.naPick===id ? null : id; rerenderList(); break; }
      S.naPick=null; S.noteDraft=null; S.notePick={id, k}; rerenderList(); setTimeout(()=>$('#q-note')?.focus(),30); break;
    }
    case 'na-cancel': S.naPick=null; rerenderList(); break;
    case 'na-motivo': {
      const m=el.dataset.m;
      if(document.querySelector('#obs')){ req.naMotivo=m; addHist(req,`Motivo de No aplica: ${m}`); save(true); render(); toast('Motivo guardado'); break; }
      S.naPick=null;
      if(m==='Otro motivo'){ applyEstado(req,'na',{naMotivo:m, silent:true}); location.hash='#/req/'+id; setTimeout(()=>{ const o=$('#obs'); o?.classList.add('need'); o?.focus(); },60); toast('Describe el motivo en la observación'); break; }
      applyEstado(req,'na',{naMotivo:m}); break;
    }
    case 'note-cancel': S.notePick=null; S.noteDraft=null; rerenderList(); break;
    case 'note-save': {
      const note=($('#q-note')?.value||'').trim(), k=S.notePick.k;
      if(!note){ toast('La nota es obligatoria para '+ESTADOS[k]); $('#q-note')?.classList.add('need'); $('#q-note')?.focus(); break; }
      S.notePick=null; S.noteDraft=null; applyEstado(req, k, {obs:note}); break;
    }
    case 'tema-na': {
      e.preventDefault();
      const t=el.dataset.t, items=activeReqs().filter(r=>r.tema===t && r.estado==='pendiente');
      askConfirm({titulo:`¿“${t}” no aplica?`, texto:`Se marcarán ${items.length} requisitos pendientes como No aplica, con el motivo “${NA_MOTIVOS[0]}”. Podrás cambiar cada uno después.`, ok:'Marcar No aplica'}, ()=>{
        const snap = items.map(r=>({r, estado:r.estado, naMotivo:r.naMotivo, h:r.hist.length}));
        items.forEach(r=>{ r.estado='na'; r.naMotivo=NA_MOTIVOS[0]; addHist(r,`Marcado como “No aplica” (tema completo): ${NA_MOTIVOS[0]}`); });
        save(true); render();
        toast(`${items.length} requisitos marcados No aplica`, ()=>{ snap.forEach(s=>{ s.r.estado=s.estado; s.r.naMotivo=s.naMotivo; s.r.hist.length=s.h; }); save(true); render(); toast('Cambio deshecho'); });
      }); break;
    }
    case 'undo': { const fn=undoFn; undoFn=null; el.closest('.toast')?.remove(); fn && fn(); break; }
    case 'ev-photo': evTarget=id; $('#file-photo').click(); break;
    case 'ev-file': evTarget=id; $('#file-any').click(); break;
    case 'ev-del': { req.evidencias.splice(+el.dataset.i,1); addHist(req,'Evidencia eliminada'); save(true); render(); break; }
    case 'theme': toggleTheme(); break;
    case 'demo': demo(); break;
    case 'reset': askConfirm({titulo:'¿Reiniciar el prototipo?', texto:'Se borrarán todas las auditorías, requisitos y evidencias guardados en este dispositivo.', ok:'Borrar todo', peligro:true},
      ()=>{ S=freshState(); syncA(); save(); toast('Prototipo reiniciado'); if(location.hash==='#/inicio') render(); else location.hash='#/inicio'; window.scrollTo(0,0); }); break;
    case 'chat-open': openChat(); break;
    case 'chat-close': $('#overlay').innerHTML=''; break;
    case 'chat-close-bg': if(e.target===el) $('#overlay').innerHTML=''; break;
    case 'chat-sug': ask(el.dataset.q); break;
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ S.q=e.target.value; rerenderList(); }
  if(e.target.id==='q-note' || e.target.id==='obs'){ S.noteDraft = e.target.id==='q-note' ? e.target.value : S.noteDraft; e.target.classList.remove('need'); }
  if(e.target.id==='validador'){ A.validador=e.target.value; const b=$('#pub-btn'); if(b) b.disabled=!e.target.value.trim() || !A.reqs.some(r=>r.val!=='descartado' && !A.temasOff.includes(r.tema)); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='obs'){ const r=A.reqs.find(x=>x.id===e.target.dataset.id);
    if(!e.target.value.trim() && r.estado==='no_cumple'){ e.target.value=r.obs; toast(`La observación es obligatoria para ${ESTADOS[r.estado]}`); return; }
    r.obs=e.target.value; addHist(r,'Observación actualizada'); save(true); }
  if(e.target.id==='validador') save();
  if(e.target.id==='file-doc' && e.target.files[0]){ const f=e.target.files[0]; A.extras.push({id:'X'+Date.now(), tipo:'Documento', numero:f.name, titulo:'Cargado por el usuario · se procesará al generar', vigencia:'Por verificar', estado:'info'}); save(); render(); toast('Documento cargado'); }
  if(e.target.id==='file-pert' && e.target.files[0]){ const f=e.target.files[0]; A.perts.push({id:'P'+Date.now(), numero:f.name, titulo:'Pertinencia cargada por el usuario', cargada:true}); save(); render(); }
  if((e.target.id==='file-photo'||e.target.id==='file-any') && e.target.files[0]) onEvidence(e.target.files[0]);
  e.target.value && e.target.type==='file' && (e.target.value='');
});
document.addEventListener('submit', e=>{ if(e.target.id==='chat-form'){ e.preventDefault(); ask($('#chat-q').value); } });

/* ---------- Conectividad: guarda local y sincroniza al volver la señal ---------- */
let syncTimer=null;
function scheduleSync(){ updateNet(); if(!navigator.onLine) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>{ S.audits.forEach(a=>a.reqs.forEach(r=>r.evidencias.forEach(ev=>ev.sync=true))); S.pending=0; try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){} updateNet(); }, 1500); }
function updateNet(){
  const n=$('#net'); if(!n) return;
  if(!navigator.onLine){ n.className='net off'; n.textContent = `Sin conexión${S.pending?` · ${S.pending} por sincronizar`:''}`; }
  else { n.className='net'; n.textContent = S.pending ? `Sincronizando ${S.pending}…` : 'En línea'; }
}
window.addEventListener('online', ()=>{ scheduleSync(); toast('Conexión recuperada: sincronizando'); });
window.addEventListener('offline', ()=>{ updateNet(); toast('Sin conexión: los cambios se guardan en el teléfono'); });
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });

applyTheme(getTheme()); load(); render(); if(S.pending) scheduleSync();
</script>
