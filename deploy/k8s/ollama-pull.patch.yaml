apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: hackaton
spec:
  template:
    spec:
      initContainers:
        - name: pull-model
          image: ollama/ollama:latest
          command:
            - sh
            - -c
            - ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull qwen3-embedding:0.6b
          env:
            - name: OLLAMA_MODELS
              value: /models
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: ollama
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_MODELS
              value: /models
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          emptyDir: {}
