apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: hackaton
  annotations:
    kubernetes.io/elb.id: 07cf0485-15ef-4971-b932-e27679a18d22
    kubernetes.io/elb.port: "80"
spec:
  ingressClassName: cce
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
