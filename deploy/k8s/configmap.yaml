apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: hackaton
data:
  NODE_ENV: production
  PORT: "3000"
  HOST: 0.0.0.0
  ALLOWED_ORIGINS: ""
  DB_HOST: 192.168.0.185
  DB_PORT: "5432"
  DB_USERNAME: hackaton_app
  DB_DATABASE: hackaton
  DB_SCHEMA: demo
  DB_SSL_CA: /etc/rds/ca.pem
  OBS_ENDPOINT: https://obs.la-south-2.myhuaweicloud.com
  OBS_REGION: la-south-2
  OBS_BUCKET: rca-hackaton
  ORBIT_BASE_URL: https://orbit.dev.core.axmos.tech/openai
  LLM_MODEL_SMALL: glm-5.3
  LLM_MODEL_LARGE: glm-5.3
  LLM_CONCURRENCY: "2"
  LLM_TIMEOUT_MS: "120000"
  OLLAMA_BASE_URL: http://ollama:11434
  EMBEDDINGS_ENABLED: "true"
  EMBEDDING_MODEL: qwen3-embedding:0.6b
  SEIA_BASE_URL: https://seia.sea.gob.cl
